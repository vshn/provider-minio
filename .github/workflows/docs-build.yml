name: Docs build

# Builds the documentation on pull requests, so a broken UI bundle URL or
# an Antora error fails the PR instead of the next publish. Publishing stays
# in docs.yml, which only runs on pushes to the default branch and on tags.
on:
  pull_request:
    paths:
      - docs/**
      - .github/workflows/docs-build.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build documentation
        run: make docs-html
